name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q

      - name: Verificar estilo
        run: python -m ruff check .

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar aplicação Cloudflare
        run: |
          node --check collection-policy.js
          node --check app.js
          node --check animations.js
          node --check pwa.js
          node --check sw.js
          node --test tests/test_collection_policy.cjs tests/test_markets_function.mjs tests/test_web_assets.mjs
